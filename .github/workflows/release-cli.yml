# Builds the CLI as one self-contained executable per release target and
# publishes them as a GitHub release, run by hand off whatever branch is being
# released. The version is `CLI_VERSION`, read from `package.json`; the run
# refuses to go on if its tag already exists, so a release is a version bump
# away. The tag itself is created when the draft is published at the end.
#
# `bun install` installs only the running machine's native packages — OpenTUI's
# core and node-datachannel's addon — so each target builds on its own runner
# and the binary is smoke-tested where it was built, away from the checkout so
# that no stray `node_modules` can stand in for something it failed to embed.

name: Release CLI (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.new }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bunx tsc -b

      - name: Determine version
        id: version
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from package.json"
            exit 1
          fi
          tag="v$version"
          echo "Release tag: $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.new }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.new }} already exists on remote. Bump the version in package.json first."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.version.outputs.new }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.new }}"
            gh release delete "${{ steps.version.outputs.new }}" --yes
          fi
          gh release create "${{ steps.version.outputs.new }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.new }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            binary: ptransfer-linux-amd64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: ptransfer-linux-arm64
          - runner: macos-latest
            target: bun-darwin-arm64
            binary: ptransfer-macos-arm64
          - runner: windows-latest
            target: bun-windows-x64
            binary: ptransfer-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:cli -- --target ${{ matrix.target }} --outfile "dist/cli/${{ matrix.binary }}"

      - name: Smoke test the binary
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          binary="$GITHUB_WORKSPACE/dist/cli/${{ matrix.binary }}"
          got="$("$binary" --version)"
          echo "binary reports: $got"
          case "$got" in
            "ptransfer $VERSION "*) ;;
            *)
              echo "::error::expected 'ptransfer $VERSION (protocol N)'"
              exit 1
              ;;
          esac
          "$binary" send --help > /dev/null
          # The native addons load only when used, so --version passes without
          # them. A Code Exchange code is printed once libdatachannel has made
          # an offer; the run then fails on the answer stdin never brings.
          code="$("$binary" send --code "$GITHUB_WORKSPACE/package.json" < /dev/null 2> send-code.err || true)"
          if [ -z "$code" ] || ! grep -q 'No code was given on standard input' send-code.err; then
            cat send-code.err
            echo "::error::send --code printed no code: the WebRTC addon did not load"
            exit 1
          fi

      # The same checks in PowerShell, which is what runs it on Windows.
      - name: Smoke test the executable
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'dist\cli\${{ matrix.binary }}'
          $got = & $binary --version
          Write-Host "executable reports: $got"
          if ($LASTEXITCODE -ne 0 -or $got -notlike "ptransfer $env:VERSION *") {
            Write-Host "::error::expected 'ptransfer $env:VERSION (protocol N)'"
            exit 1
          }
          & $binary send --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $code = $null | & $binary send --code (Join-Path $env:GITHUB_WORKSPACE 'package.json') 2> send-code.err
          if (-not $code -or -not (Select-String -Quiet 'No code was given on standard input' send-code.err)) {
            Get-Content send-code.err
            Write-Host "::error::send --code printed no code: the WebRTC addon did not load"
            exit 1
          }
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/cli/${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ptransfer-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.setup.outputs.release_tag }}" artifacts/* --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
